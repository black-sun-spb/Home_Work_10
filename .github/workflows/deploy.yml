name: Django CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/*

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest

    # Добавляем сервис PostgreSQL
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Настраиваем .env для тестов
      - name: Configure .env
        run: |
          echo "DB_NAME=test_db" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "DB_HOST=db" >> .env  # Имя сервиса, а не localhost
          echo "DB_PORT=5432" >> .env

      # Ждём готовности PostgreSQL
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            nc -zv db 5432 && echo "PostgreSQL is ready!" && break
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      # Запускаем миграции
      - name: Run migrations
        run: python manage.py migrate

      # Запуск тестов
      - name: Run tests
        run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: home_work_7.settings_test

      # Деплой (только если тесты прошли)
      - name: Deploy to server
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/home_work_10
            git pull origin ${{ github.ref_name }}  # Динамическая ветка
            docker-compose down
            docker-compose up -d --build
