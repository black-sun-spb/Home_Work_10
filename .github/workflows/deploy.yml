# .github/workflows/deploy.yml
name: Django CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/*

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: project_db
          POSTGRES_USER: admin_user
          POSTGRES_PASSWORD: StrongPass!2025
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin_user -d project_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Настройка .env для тестов
      - name: Configure .env
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "DEBUG=1" >> .env
          echo "DB_NAME=project_db" >> .env
          echo "DB_USER=admin_user" >> .env
          echo "DB_PASSWORD=StrongPass!2025" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "ALLOWED_HOSTS=158.160.182.105,localhost,127.0.0.1" >> .env
          echo "STRIPE_API_KEY=sk_test_1234567890abcdef" >> .env
          echo "DJANGO_SETTINGS_MODULE=home_work_7.settings_test" >> .env

      # Ждём пока сервисы будут готовы (Healthcheck встроен в сервисы)
      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL and Redis..."
          for i in {1..20}; do
            if [[ $(docker inspect --format='{{.State.Health.Status}}' $(docker ps -qf "name=db")) == "healthy" ]] && \
               [[ $(docker inspect --format='{{.State.Health.Status}}' $(docker ps -qf "name=redis")) == "healthy" ]]; then
              echo "All services are healthy!"
              exit 0
            fi
            echo "Services not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Services failed to become healthy!"
          exit 1

      # Запуск миграций
      - name: Run migrations
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: home_work_7.settings_test

      # Запуск тестов
      - name: Run tests
        run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: home_work_7.settings_test

      # Деплой на сервер (только если тесты прошли)
      - name: Deploy to server
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/home_work_10
            git pull origin ${{ github.ref_name }}
            docker-compose down
            docker-compose up -d --build
