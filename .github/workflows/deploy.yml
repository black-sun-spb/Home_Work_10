name: Django CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/*

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: project_db
          POSTGRES_USER: admin_user
          POSTGRES_PASSWORD: StrongPass!2025
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Настройка .env для тестов
      - name: Configure .env
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "DEBUG=0" >> .env
          echo "ALLOWED_HOSTS=127.0.0.1,localhost" >> .env
          echo "DB_NAME=project_db" >> .env
          echo "DB_USER=admin_user" >> .env
          echo "DB_PASSWORD=StrongPass!2025" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "DJANGO_SETTINGS_MODULE=home_work_7.settings_test" >> .env

      # Ждём готовности PostgreSQL
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if nc -zv db 5432; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Attempt $i: PostgreSQL not ready, waiting 5s..."
            sleep 5
          done
          echo "PostgreSQL failed to start!"
          exit 1

      # Применяем миграции
      - name: Run migrations
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: home_work_7.settings_test

      # Запуск тестов
      - name: Run tests
        run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: home_work_7.settings_test

      # Деплой (если тесты успешны)
      - name: Deploy to server
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/Home_work_10
            git pull origin ${{ github.ref_name }}
            docker-compose down
            docker-compose up -d --build

