version: "3.9"

services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A home_work_7 worker --loglevel=INFO
    env_file:
      - ./.env
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
      - db

  celery_beat:
    build: .
    command: celery -A home_work_7 beat --loglevel=INFO
    env_file:
      - ./.env
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
      - db

volumes:
  postgres_data:
