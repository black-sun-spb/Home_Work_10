version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: taisiya
      POSTGRES_PASSWORD: password
      POSTGRES_DB: home_work_10
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:

