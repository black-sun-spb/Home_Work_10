version: "3.9"

services:
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - DOCKER_ENV=1
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build: ./backend
    command: celery -A home_work_7 worker --loglevel=INFO
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - db

  celery_beat:
    build: ./backend
    command: celery -A home_work_7 beat --loglevel=INFO
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - db

volumes:
  postgres_data:

